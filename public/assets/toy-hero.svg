<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">TrailTurn floor toy</title>
  <desc id="heroDesc">A round birch drum with three sage paddles. The first paddle is raised above a printed three-step route. A brass timer dial sits on the front.</desc>
  <defs>
    <radialGradient id="topWood" cx="36%" cy="28%" r="82%">
      <stop offset="0" stop-color="#f5e6c9"/>
      <stop offset="0.55" stop-color="#e4c99f"/>
      <stop offset="1" stop-color="#caa574"/>
    </radialGradient>
    <linearGradient id="sideWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ca9255"/>
      <stop offset="0.55" stop-color="#b97a3f"/>
      <stop offset="1" stop-color="#925828"/>
    </linearGradient>
    <linearGradient id="paddleFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfcdb5"/>
      <stop offset="1" stop-color="#8fa383"/>
    </linearGradient>
    <linearGradient id="paddleSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#708668"/>
      <stop offset="1" stop-color="#4f664b"/>
    </linearGradient>
    <radialGradient id="brass" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#f2dda2"/>
      <stop offset="0.58" stop-color="#c9a45c"/>
      <stop offset="1" stop-color="#8f692b"/>
    </radialGradient>
    <filter id="floorShadow" x="-40%" y="-80%" width="180%" height="260%">
