    </filter>
    <filter id="toyShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#3a2a17" flood-opacity="0.22"/>
    </filter>
    <clipPath id="sideClip">
      <path d="M130 350 L130 430 A250 150 0 0 0 630 430 L630 350 Z"/>
    </clipPath>
  </defs>

  <ellipse cx="380" cy="612" rx="272" ry="36" fill="#3a2a17" opacity="0.16" filter="url(#floorShadow)"/>

