<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="topTitle topDesc">
  <title id="topTitle">TrailTurn top view</title>
  <desc id="topDesc">Top view of the TrailTurn drum with three sage paddles, a printed route, and a brass hub.</desc>
  <defs>
    <radialGradient id="thumbTop" cx="36%" cy="28%" r="82%">
      <stop offset="0" stop-color="#f5e6c9"/>
      <stop offset="0.55" stop-color="#e4c99f"/>
      <stop offset="1" stop-color="#caa574"/>
    </radialGradient>
    <linearGradient id="thumbPaddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfcdb5"/>
      <stop offset="1" stop-color="#8fa383"/>
    </linearGradient>
    <linearGradient id="thumbPaddleSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#708668"/>
      <stop offset="1" stop-color="#4f664b"/>
    </linearGradient>
    <radialGradient id="thumbBrass" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#f2dda2"/>
      <stop offset="0.58" stop-color="#c9a45c"/>
      <stop offset="1" stop-color="#8f692b"/>
    </radialGradient>
    <filter id="thumbShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3a2a17" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#thumbShadow)">
    <circle cx="300" cy="300" r="242" fill="url(#thumbTop)" stroke="#2b241b" stroke-width="4"/>
    <circle cx="300" cy="300" r="226" fill="none" stroke="#b8874c" stroke-width="2" opacity="0.7"/>
    <circle cx="300" cy="300" r="208" fill="none" stroke="#8c6237" stroke-width="1.2" opacity="0.3"/>
  </g>

  <g opacity="0.22" fill="none" stroke="#9b6f41" stroke-width="1.4">
    <path d="M140 276c32-32 104-48 174-48 60 0 128 14 164 38"/>
    <path d="M120 318c40-28 112-42 190-42 68 0 140 14 184 38"/>
    <path d="M160 382c42-24 100-34 160-34 56 0 112 10 152 28"/>
  </g>

  <path d="M300 128 L448 410 L152 410" fill="none" stroke="#b45f3e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 10" opacity="0.85"/>

  <g transform="translate(448 410)">
    <ellipse cx="0" cy="7" rx="44" ry="26" fill="#7d4b22" opacity="0.26"/>
    <path d="M0 -38C21 -38 38 -21 38 0C38 23 21 38 0 38C-21 38 -38 23 -38 0C-38 -21 -21 -38 0 -38Z" fill="url(#thumbPaddle)" stroke="#2b241b" stroke-width="3" opacity="0.94"/>
    <text x="0" y="7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2f4a38" opacity="0.7">2</text>
  </g>
  <g transform="translate(152 410)">
    <ellipse cx="0" cy="7" rx="44" ry="26" fill="#7d4b22" opacity="0.26"/>
    <path d="M0 -38C21 -38 38 -21 38 0C38 23 21 38 0 38C-21 38 -38 23 -38 0C-38 -21 -21 -38 0 -38Z" fill="url(#thumbPaddle)" stroke="#2b241b" stroke-width="3" opacity="0.94"/>
    <text x="0" y="7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2f4a38" opacity="0.7">3</text>
  </g>

  <g transform="translate(300 128)">
    <ellipse cx="0" cy="28" rx="50" ry="25" fill="#3a2a17" opacity="0.2"/>
    <path d="M0 15C20 15 37 32 37 53C37 76 20 90 0 90C-20 90 -37 76 -37 53C-37 32 -20 15 0 15Z" fill="url(#thumbPaddleSide)" stroke="#2b241b" stroke-width="3"/>
    <path d="M0 -50C22 -50 41 -31 41 -8C41 15 22 34 0 34C-22 34 -41 15 -41 -8C-41 -31 -22 -50 0 -50Z" fill="url(#thumbPaddle)" stroke="#2b241b" stroke-width="3.2"/>
    <text x="0" y="3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2f4a38">1</text>
  </g>

  <g transform="translate(300 300)">
    <circle cx="0" cy="0" r="50" fill="url(#thumbBrass)" stroke="#2b241b" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#7d5b24" stroke-width="1.4" opacity="0.55"/>
    <circle cx="0" cy="0" r="8" fill="#7d5b24" opacity="0.75"/>
