<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="planTitle planDesc">
  <title id="planTitle">TrailTurn, overhead route view</title>
  <desc id="planDesc">Overhead view of the forest-green TrailTurn. Three cream paddles sit in a shallow arc around a centre hub, a tomato-red route links paddle one to paddle two to paddle three, and a reward cup sits at the front.</desc>
  <defs>
    <filter id="planShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="742" rx="252" ry="30" fill="#20251F" opacity="0.12" filter="url(#planShadow)"/>

  <circle cx="400" cy="390" r="300" fill="#294C3C" stroke="#20251F" stroke-width="5"/>
  <circle cx="400" cy="390" r="280" fill="none" stroke="#F5F0E5" stroke-width="2.5" opacity="0.4"/>
  <circle cx="400" cy="390" r="250" fill="#355C48" stroke="#20251F" stroke-width="2" opacity="0.7"/>

  <g stroke="#F5F0E5" stroke-width="2" opacity="0.2">
    <path d="M400 112 L400 130"/>
    <path d="M400 650 L400 668"/>
    <path d="M122 390 L140 390"/>
    <path d="M660 390 L678 390"/>
  </g>

  <path d="M400 178 L258 512" fill="none" stroke="#B93827" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 10"/>
  <path d="M258 512 L542 512" fill="none" stroke="#B93827" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 10"/>
  <circle cx="400" cy="178" r="7" fill="#B93827"/>
  <circle cx="258" cy="512" r="7" fill="#B93827"/>
  <circle cx="542" cy="512" r="7" fill="#B93827"/>

  <g transform="translate(400 178)">
