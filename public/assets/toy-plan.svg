    <rect x="-76" y="-58" width="152" height="96" rx="48" fill="#F1E7D0" stroke="#20251F" stroke-width="5"/>
    <path d="M-50 -32 C-32 -46 -8 -48 10 -42" fill="none" stroke="#FBF7EF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
