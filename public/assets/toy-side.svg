<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="sideTitle sideDesc">
  <title id="sideTitle">TrailTurn side view</title>
  <desc id="sideDesc">A side view of the TrailTurn drum with the first sage paddle lifted above the birch top, a brass timer dial on the front, and dimension lines.</desc>
  <defs>
    <radialGradient id="sideTop" cx="36%" cy="28%" r="82%">
      <stop offset="0" stop-color="#f5e6c9"/>
      <stop offset="0.55" stop-color="#e4c99f"/>
      <stop offset="1" stop-color="#caa574"/>
    </radialGradient>
    <linearGradient id="sideBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ca9255"/>
      <stop offset="0.55" stop-color="#b97a3f"/>
      <stop offset="1" stop-color="#925828"/>
    </linearGradient>
    <linearGradient id="sidePaddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfcdb5"/>
      <stop offset="1" stop-color="#8fa383"/>
    </linearGradient>
    <linearGradient id="sidePaddleEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#708668"/>
      <stop offset="1" stop-color="#4f664b"/>
    </linearGradient>
    <radialGradient id="sideBrass" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#f2dda2"/>
      <stop offset="0.58" stop-color="#c9a45c"/>
      <stop offset="1" stop-color="#8f692b"/>
    </radialGradient>
    <filter id="sideShadow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="sideDrop" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#3a2a17" flood-opacity="0.2"/>
    </filter>
    <clipPath id="sideBodyClip">
      <path d="M390 400 L390 520 A210 70 0 0 0 810 520 L810 400 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="#e8dfd0"/>
  <circle cx="600" cy="430" r="310" fill="none" stroke="#20211c" stroke-width="1" stroke-dasharray="3 9" opacity="0.18"/>
  <path d="M0 690h1200" stroke="#20211c" stroke-width="1.4" opacity="0.24"/>
  <g stroke="#20211c" stroke-width="0.8" opacity="0.08">
    <path d="M0 180h1200M0 360h1200M0 540h1200M0 720h1200M0 900h1200"/>
    <path d="M180 0v900M360 0v900M540 0v900M720 0v900M900 0v900M1080 0v900"/>
  </g>

  <ellipse cx="600" cy="672" rx="260" ry="30" fill="#3a2a17" opacity="0.16" filter="url(#sideShadow)"/>

  <g filter="url(#sideDrop)">
    <path d="M390 400 L390 520 A210 70 0 0 0 810 520 L810 400 Z" fill="url(#sideBody)" stroke="#2b241b" stroke-width="2.6"/>
    <g clip-path="url(#sideBodyClip)" opacity="0.4">
      <path d="M360 438c110 32 370 32 480 0" fill="none" stroke="#7c4720" stroke-width="1.2"/>
      <path d="M350 468c120 36 380 36 500 0" fill="none" stroke="#7c4720" stroke-width="1"/>
      <path d="M360 498c110 32 370 32 480 0" fill="none" stroke="#7c4720" stroke-width="1.2"/>
      <path d="M390 528c90 28 330 28 420 0" fill="none" stroke="#7c4720" stroke-width="1"/>
    </g>
    <path d="M390 520 A210 70 0 0 0 810 520" fill="none" stroke="#6d3e1d" stroke-width="2" opacity="0.5"/>
    <ellipse cx="600" cy="400" rx="210" ry="70" fill="url(#sideTop)" stroke="#2b241b" stroke-width="2.4"/>
    <ellipse cx="600" cy="400" rx="198" ry="62" fill="none" stroke="#b8874c" stroke-width="1.2" opacity="0.72"/>
    <path d="M420 410c60-22 300-22 360 0" fill="none" stroke="#9b6f41" stroke-width="1" opacity="0.25"/>
    <path d="M438 432c48-14 276-14 324 0" fill="none" stroke="#9b6f41" stroke-width="1" opacity="0.2"/>

    <g transform="translate(600 400)">
      <circle cx="0" cy="0" r="34" fill="url(#sideBrass)" stroke="#2b241b" stroke-width="1.6" opacity="0.95"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#7d5b24" stroke-width="0.8" opacity="0.55"/>
      <circle cx="0" cy="0" r="5" fill="#7d5b24" opacity="0.8"/>
    </g>

    <g transform="translate(600 502)">
      <circle cx="0" cy="0" r="38" fill="url(#sideBrass)" stroke="#2b241b" stroke-width="2"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#7d5b24" stroke-width="0.9" opacity="0.55"/>
      <circle cx="0" cy="0" r="3.5" fill="#7d5b24"/>
      <path d="M0 0 L0 -22" stroke="#5f421c" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 -30v4M0 26v4M-30 0h4M26 0h4" stroke="#7d5b24" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
      <text x="18" y="-18" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#5e4519" opacity="0.75">15</text>
      <text x="22" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#5e4519" opacity="0.75">30</text>
      <text x="-21" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#5e4519" opacity="0.75">45</text>
      <text x="-18" y="-18" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#5e4519" opacity="0.75">0</text>
    </g>

    <text x="600" y="568" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="4" fill="#5c381a" opacity="0.68">TRAILTURN</text>

    <g transform="translate(600 330)">
      <ellipse cx="0" cy="72" rx="54" ry="20" fill="#3a2a17" opacity="0.18"/>
      <path d="M0 40C24 40 44 60 44 84C44 108 24 124 0 124C-24 124 -44 108 -44 84C-44 60 -24 40 0 40Z" fill="url(#sidePaddleEdge)" stroke="#2b241b" stroke-width="2"/>
      <path d="M0 -52C28 -52 52 -30 52 0C52 30 28 54 0 54C-28 54 -52 30 -52 0C-52 -30 -28 -52 0 -52Z" fill="url(#sidePaddle)" stroke="#2b241b" stroke-width="2.2"/>
      <path d="M-38 -24C-26 -42 -8 -48 10 -46" fill="none" stroke="#e6efdf" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2f4a38">1</text>
    </g>
  </g>

  <g stroke="#20211c" stroke-width="1" opacity="0.42" fill="none">
    <path d="M390 610v22M810 610v22"/>
    <path d="M390 626h420"/>
    <path d="M398 622l-8 4 8 4M802 622l8 4-8 4"/>
    <path d="M850 400h22M850 580h22"/>
    <path d="M866 400v180"/>
    <path d="M862 408l4-8 4 8M862 572l4 8 4-8"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#20211c" opacity="0.55">
    <text x="600" y="652" text-anchor="middle">34 CM</text>
    <text x="884" y="494" text-anchor="middle" transform="rotate(90 884 494)">11 CM</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6" fill="#20211c" opacity="0.52">
    <path d="M708 300c46-14 78-10 104 10" fill="none" stroke="#20211c" stroke-width="1" opacity="0.3"/>
    <text x="818" y="296">THE NEXT PADDLE</text>
    <text x="818" y="312">STAYS UP</text>
  </g>
</svg>
