# fly.toml app configuration file generated for happy-while-away on 2026-11-21T11:32:55Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'happy-while-away'
primary_region = 'ams'

[build]
[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  TRUST_PROXY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
